name: Testes de API

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar o .env a partir do .env.example
        run: cp .env.example .env

      - name: Iniciar a API em segundo plano
        run: nohup node src/server.js > api.log 2>&1 &

      - name: Aguardar a API iniciar
        run: sleep 10

      - name: Executar testes
        run: npm test

      - name: Exibir log da API em caso de falha
        if: failure()
        run: cat api.log
